<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b36"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#c084fc" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#86198f"/>
    </linearGradient>
    <linearGradient id="beamL" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="beamC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="beamR" x1="1" y1="0" x2="0.3" y2="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="rightHalf"><rect x="256" y="120" width="240" height="310"/></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- one fused silhouette: triggers, shoulders, body, teardrop grips -->
    <path id="padBody" d="M 176,196
      H 336
      C 378,196 400,214 404,248
      L 422,318
      C 428,348 414,372 388,368
      C 366,364 350,350 338,336
      C 326,324 316,320 302,320
      L 210,320
      C 196,320 186,324 174,336
      C 162,350 146,364 124,368
      C 98,372 84,348 90,318
      L 108,248
      C 112,214 134,196 176,196
      Z"/>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <ellipse cx="256" cy="280" rx="215" ry="170" fill="url(#halo)"/>

  <!-- converging beams: other controllers merging in -->
  <g stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M108 118 L240 184" stroke="url(#beamL)"/>
    <path d="M256 96 L256 180" stroke="url(#beamC)"/>
    <path d="M404 118 L272 184" stroke="url(#beamR)"/>
  </g>
  <circle cx="108" cy="114" r="11" fill="#22d3ee"/>
  <circle cx="256" cy="92" r="11" fill="#e2e8f0"/>
  <circle cx="404" cy="114" r="11" fill="#e879f9"/>

  <!-- triggers -->
  <rect x="186" y="172" width="44" height="32" rx="12" fill="url(#gL)"/>
  <rect x="282" y="172" width="44" height="32" rx="12" fill="url(#gR)"/>

  <!-- pad: cyan half + magenta half -->
  <use xlink:href="#padBody" href="#padBody" fill="url(#gL)"/>
  <g clip-path="url(#rightHalf)">
    <use xlink:href="#padBody" href="#padBody" fill="url(#gR)"/>
  </g>

  <!-- fusion seam -->
  <path d="M256 206 L256 314" stroke="#a5f3fc" stroke-width="7" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <path d="M256 206 L256 314" stroke="#ecfeff" stroke-width="3" stroke-linecap="round"/>

  <!-- engraved controls -->
  <g fill="#0b1326" opacity="0.92">
    <rect x="146" y="244" width="64" height="20" rx="6"/>
    <rect x="168" y="222" width="20" height="64" rx="6"/>
    <circle cx="334" cy="224" r="12"/>
    <circle cx="304" cy="254" r="12"/>
    <circle cx="364" cy="254" r="12"/>
    <circle cx="334" cy="284" r="12"/>
    <circle cx="222" cy="302" r="14"/>
    <circle cx="290" cy="302" r="14"/>
  </g>
  <g fill="none" stroke="#0b1326" stroke-width="4" opacity="0.35">
    <circle cx="222" cy="302" r="18"/>
    <circle cx="290" cy="302" r="18"/>
  </g>
</svg>